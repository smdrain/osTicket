#
# Email template: ticket.sla.warn.yaml
#
# Sent to staff members when a ticket is approaching its SLA due date.
# This is a pre-breach warning to give agents time to respond before
# the ticket becomes overdue.
#
---
notes: |
    Sent to staff members when a ticket is approaching its SLA due date.
    This is a pre-breach warning to give agents time to respond before
    the ticket becomes overdue.

subject: |
    SLA Warning: Ticket #%{ticket.number} approaching due date
body: |
    <h3><strong>Hi %{recipient.name}</strong>,</h3>
    Ticket <a href="%{ticket.staff_link}">#%{ticket.number}</a> is
    approaching its SLA due date and requires attention.
    <br>
    <br>
    <strong>Subject:</strong> %{ticket.subject}<br>
    <strong>Department:</strong> %{ticket.dept.name}<br>
    <strong>Due Date:</strong> %{ticket.duedate}<br>
    <br>
    Please take action on this ticket to avoid an SLA breach.
    <br>
    <br>
    Signed,<br>
    %{ticket.dept.manager.name}
    <hr>
    <div>To view or respond to the ticket, please <a
    href="%{ticket.staff_link}"><span style="color: rgb(84, 141, 212);"
    >login</span></a> to the support ticket system. You're receiving this
    notice because the ticket is assigned directly to you or to a team or
    department of which you're a member.</div>
    <em style="font-size: small">Your friendly Customer Support
    System</em><br>
    <img src="cid:b56944cb4722cc5cda9d1e23a3ea7fbc" height="19"
        alt="Powered by osTicket" width="126" style="width: 126px;">
